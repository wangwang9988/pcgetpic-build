[package]
name = "tuget-native-host"
version = "0.1.0"
edition = "2024"
description = "Native Messaging to Windows Named Pipe bridge for TuGet desktop"
license = "UNLICENSED"
publish = false
build = "build.rs"

[dependencies]
jsonschema = { version = "0.49.2", default-features = false }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1.0"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
